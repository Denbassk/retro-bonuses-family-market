// ═══════════ Загрузка Excel: черновик → подтверждение → запись пачкой → автосверка ═══════════
// Всё идёт через локальный сервер core/admin_server.py (start_admin.bat), он же пишет журнал retro_fact_imports.

async function apiFetch(path, opts = {}) {
  const { data: { session } } = await sb.auth.getSession();
  const headers = Object.assign({}, opts.headers || {}, { Authorization: 'Bearer ' + (session ? session.access_token : '') });
  let resp;
  try { resp = await fetch(path, Object.assign({}, opts, { headers })); }
  catch (e) { throw new Error('Сервер админки не отвечает. Откройте админку через start_admin.bat.'); }
  let body = {};
  try { body = await resp.json(); } catch (e) { /* не JSON */ }
  if (!resp.ok) throw new Error(body.error || ('HTTP ' + resp.status + ' — откройте админку через start_admin.bat'));
  return body;
}

// ── Светофор по данным: показывает последний отчёт bq_docs.health() (CSV), сам ничего не считает ──
// Человеческие формулировки: что случилось и что с этим делать. Ключи — типы из bq_docs.
const DH_TYPES = {
  missing:   { what: 'не загружено к нам',            fix: 'догрузить приходы за эти даты' },
  double:    { what: 'загружено к нам дважды',        fix: 'удалить дубль в BigQuery' },
  amount:    { what: 'загружена часть строк документа', fix: 'перезалить эти документы' },
  extra:     { what: 'нет в выгрузке Торгсофта',      fix: 'проверить выгрузку эталона за эти даты' },
  date:      { what: 'документ попал в соседний месяц', fix: 'ничего не делать' },
  number:    { what: 'другой номер, соседний месяц',  fix: 'ничего не делать' },
  et_double: { what: 'дубль в самом Торгсофте, у нас верно', fix: 'ничего не делать' },
};
let dhScope = 'retro';   // retro = только поставщики с ретро, all = все контрагенты

function dhKind(t) {
  const own = Object.entries(t || {}).filter(([k]) => k !== 'et_double')
    .sort((a, b) => Math.abs(b[1].delta) - Math.abs(a[1].delta));
  const sum = own.reduce((s, x) => s + x[1].delta, 0);
  const bad = (t.missing ? t.missing.n : 0) + (t.double ? t.double.n : 0);
  const light = !own.length ? ['🟢', 'var(--green)'] : (bad || Math.abs(sum) >= 50000 ? ['🔴', 'var(--red)'] : ['🟡', 'var(--orange)']);
  return { icon: light[0], color: light[1], sum,
           txt: own.map(x => {
             const T = DH_TYPES[x[0]] || { what: x[0], fix: '' };
             // диапазон дат: сразу видно, какой кусок месяца догружать или где искать дубли
             const rng = x[1].range ? ` <span style="color:var(--text2)">[${escHtml(x[1].range)}]</span>` : '';
             return `${T.what}: ${x[1].n} док. на ${fmt(Math.abs(x[1].delta))} ₴${rng}` + (T.fix && T.fix !== 'ничего не делать' ? ` → ${T.fix}` : '');
           }).join('<br>') || 'всё сходится с Торгсофтом' };
}

// ── Позиционный отчёт по SKU: читает готовый output\sku_coverage_2026.csv (tools\sku_coverage.py) ──
// Три представления: сводка поставщик x месяц, позиции одной пары, топ-50 по «недосчитано».
const SKU_KINDS = ['вне правил', 'сырьё', 'исключён правилом'];
const SKU_HINT = {
  'в правиле': 'посчитано',
  'вне правил': 'приход есть, правила нет',
  'сырьё': 'исключено расчётом как сырьё',
  'исключён правилом': 'баркод в excluded_sku_barcodes',
  'покрыт правилом другого поставщика': 'общий алиас: ретро посчитано у соседа, оценка не делается',
  'нет активных правил в месяце': 'в этом месяце у поставщика нет ни одного правила',
  'база не от приходов': 'оплаты / порции / покрытие ТТ - приход не база',
};

function skuFlagBadge(a) {
  const out = [];
  if (a.flagged) out.push('<span title="за месяц есть недогруз или задвоение документов" style="color:var(--red)">⚠ данные</span>');
  if (a.truth) out.push('<span title="январь-июнь: пересчёт запрещён, цифры справочные" style="color:#a78bfa">TRUTH_UNTIL</span>');
  return out.join(' ');
}

function skuCounts(n) {
  return Object.entries(n || {}).sort((a, b) => b[1] - a[1])
    .map(([k, v]) => `<span title="${escHtml(SKU_HINT[k] || '')}">${escHtml(k)} ${v}</span>`).join(' · ');
}

function skuTable(pairs, note) {
  if (!pairs.length) return '';
  const sum = k => pairs.reduce((s, a) => s + (a.under[k] || 0), 0);
  return `<div style="font-size:12px;color:var(--text2);margin:10px 0 4px">${note}
      — итого: вне правил <b>${fmt(sum('вне правил'))}</b> ₴ · сырьё <b>${fmt(sum('сырьё'))}</b> ₴ ·
      исключено правилом <b>${fmt(sum('исключён правилом'))}</b> ₴ (не суммируются: причины разные)</div>
    <table><thead><tr>
      <th>Месяц</th><th>Поставщик</th><th style="text-align:right">База</th><th style="text-align:right">Ретро посчитано</th>
      <th style="text-align:right">Вне правил</th><th style="text-align:right">Сырьё</th><th style="text-align:right">Исключён правилом</th>
      <th>Позиции</th><th>Отметки</th></tr></thead><tbody>` +
    pairs.map(a => `<tr class="editable" style="cursor:pointer;${a.flagged ? 'background:rgba(248,113,113,0.06)' : ''}"
        onclick="skuPair('${encodeURIComponent(a.supplier)}','${a.per}')" title="Открыть позиции">
      <td>${escHtml(a.per)}</td><td>${escHtml(a.supplier)}</td>
      <td style="text-align:right">${fmt(a.base)}</td>
      <td style="text-align:right;color:var(--green)">${fmt(a.retro)}</td>
      <td style="text-align:right">${a.under['вне правил'] ? fmt(a.under['вне правил']) : ''}</td>
      <td style="text-align:right">${a.under['сырьё'] ? fmt(a.under['сырьё']) : ''}</td>
      <td style="text-align:right">${a.under['исключён правилом'] ? fmt(a.under['исключён правилом']) : ''}</td>
      <td style="font-size:11px;color:var(--text2)">${skuCounts(a.n)}</td>
      <td style="font-size:11px">${skuFlagBadge(a)}</td></tr>`).join('') + '</tbody></table>';
}

async function showSkuCoverage() {
  const wrap = document.getElementById('table-wrap');
  wrap.innerHTML = '<div class="loading">Читаю позиционный отчёт…</div>';
  let d, t;
  try {
    d = await apiFetch('/api/sku-coverage?view=summary');
    if (!d.ok) { wrap.innerHTML = `<div class="loading" style="color:var(--orange)">${escHtml(d.error)}</div>`; return; }
    t = await apiFetch('/api/sku-coverage?view=top');
  } catch (e) { wrap.innerHTML = `<div class="loading" style="color:var(--red)">${escHtml(e.message)}</div>`; return; }

  const work = d.pairs.filter(a => !a.truth), truth = d.pairs.filter(a => a.truth);
  const badge = document.getElementById('count-badge');
  if (badge) badge.textContent = `пар ${d.pairs.length} · рабочих ${work.length} · справочных ${truth.length}`;
  let h = `<div style="padding:10px 16px;background:var(--surface2);border-radius:8px;margin:12px 0;font-size:13px">
    <b>📦 Позиции: что попало в ретро, а что нет</b> — клик по строке открывает позиции этой пары.
    <div style="margin-top:4px">«Недосчитано» — оценка ретро по непокрытому приходу: <b>вне правил</b>, <b>сырьё</b> и
    <b>исключён правилом</b> показаны раздельно, потому что решения по ним разные. По статусу
    «покрыт правилом другого поставщика» (общий алиас) оценка не делается — там ретро уже посчитано у соседа.</div>
    <div style="margin-top:4px;color:var(--text2)">отчёт ${escHtml(d.file)} от
      ${escHtml((d.updated || '').slice(0, 16).replace('T', ' '))} — обновляется командой
      <code>python tools\\sku_coverage.py</code></div></div>`;

  if (t && t.ok && t.rows.length) {
    h += `<details open style="margin-top:8px"><summary style="cursor:pointer;font-size:14px;font-weight:600">
        Топ-50 по «недосчитано» — только пары без проблем с данными ▾</summary>` +
      impTable('', ['Месяц', 'Поставщик', 'Баркод', 'Наименование', 'Что не так', 'Приход', 'Недосчитано'],
        t.rows.map(r => `<tr>
          <td>${escHtml(r.per)}${r.truth ? ' <span style="color:#a78bfa;font-size:10px">справочно</span>' : ''}</td>
          <td>${escHtml(r.supplier)}</td><td>${escHtml(r.bc)}</td><td>${escHtml(r.name || '')}</td>
          <td title="${escHtml(SKU_HINT[r.status.split(';')[0]] || '')}">${escHtml(r.status)}</td>
          <td style="text-align:right">${fmt(r.inc)}</td>
          <td style="text-align:right;color:var(--orange)">${fmt(r.under)}</td></tr>`).join('')) + '</details>';
  }
  h += `<h3 style="margin:18px 0 4px;font-size:14px">Рабочие месяцы (июль и позже)</h3>` +
       skuTable(work, 'Эти цифры рабочие') +
       `<h3 style="margin:22px 0 4px;font-size:14px;color:#a78bfa">Январь–июнь: TRUTH_UNTIL, справочно</h3>
        <div style="font-size:12px;color:var(--text2)">Пересчёт этих месяцев запрещён: истина — сохранённый расчёт.
        Суммы ниже с рабочими месяцами не складывать, это материал для правил и разговора с поставщиком.</div>` +
       skuTable(truth, 'Справочно');
  wrap.innerHTML = h;
}

async function skuPair(supplierEnc, per) {

  const wrap = document.getElementById('table-wrap');

  let d;
  try { d = await apiFetch(`/api/sku-coverage?view=pair&supplier=${encodeURIComponent(supplier)}&month=${per}`); }
  catch (e) { wrap.innerHTML = `<div class="loading" style="color:var(--red)">${escHtml(e.message)}</div>`; return; }
  if (!d.ok) { wrap.innerHTML = `<div class="loading" style="color:var(--orange)">${escHtml(d.error)}</div>`; return; }
  const truth = per <= d.truth_until;
  let h = `<div style="padding:10px 16px;background:var(--surface2);border-radius:8px;margin:12px 0;font-size:13px">
    <button class="btn btn-ghost" style="font-size:12px;padding:3px 10px" onclick="showSkuCoverage()">← к сводке</button>
    <b style="margin-left:10px">${escHtml(supplier)} · ${escHtml(per)}</b>
    <span style="color:var(--text2)"> позиций ${d.total}${d.rows.length < d.total ? `, показаны первые ${d.rows.length}` : ''}</span>
    ${truth ? '<div style="color:#a78bfa;margin-top:4px">TRUTH_UNTIL: январь–июнь не пересчитываем, цифры справочные</div>' : ''}
    ${d.flags ? `<div style="color:var(--red);margin-top:4px">⚠ отметки месяца: ${escHtml(d.flags)} — «недосчитано» по этой паре под вопросом</div>` : ''}
  </div>`;
  h += `<table><thead><tr><th>Баркод</th><th>Наименование</th><th>Бренд</th><th>Что со SKU</th><th>Правило</th>
      <th style="text-align:right">Кол-во</th><th style="text-align:right">Приход</th><th style="text-align:right">Возвраты</th>
      <th style="text-align:right">База</th><th style="text-align:right">Ретро</th><th style="text-align:right">Недосчитано</th>
      </tr></thead><tbody>` +
    d.rows.map(r => `<tr>
      <td>${escHtml(r.bc)}</td><td>${escHtml(r.name || '')}</td><td>${escHtml(r.brand || '')}</td>
      <td title="${escHtml(SKU_HINT[r.status.split(';')[0]] || '')}">${escHtml(r.status)}</td>
      <td style="font-size:11px;color:var(--text2)">${escHtml(r.rule || '')}${r.rate ? ' · ' + escHtml(r.rate) + '%' : ''}</td>
      <td style="text-align:right">${escHtml(r.qty || '')}</td>
      <td style="text-align:right">${fmt(r.inc)}</td>
      <td style="text-align:right">${r.ret ? fmt(r.ret) : ''}</td>
      <td style="text-align:right">${fmt(r.base)}</td>
      <td style="text-align:right;color:var(--green)">${r.retro ? fmt(r.retro) : ''}</td>
      <td style="text-align:right;color:var(--orange)">${r.under ? fmt(r.under) : ''}</td></tr>`).join('') + '</tbody></table>';
  wrap.innerHTML = h;
}

async function uploadRetroExcel() {
  const f = document.getElementById('imp-file').files[0];
  const wrap = document.getElementById('table-wrap');
  if (!f) { toast('Выберите файл .xlsx', true); return; }
  wrap.innerHTML = '<div class="loading">Разбираю файл и сравниваю с базой…</div>';
  if (importDraft) {   // старый черновик заменяется новым
    try { await apiFetch(`/api/imports/${importDraft.import_id}/cancel`, { method: 'POST' }); } catch (e) { /* не критично */ }
    importDraft = null;
  }
  importJobId = null;
  try {
    importDraft = await apiFetch('/api/upload', { method: 'POST', body: f, headers: { 'X-Filename': encodeURIComponent(f.name) } });
    renderImportDraft();
  } catch (e) {
    wrap.innerHTML = `<div class="loading" style="color:var(--red)">${escHtml(e.message)}</div>`;
  }
}

function impTable(title, head, rowsHtml) {
  return (title ? `<h3 style="margin:18px 0 8px;font-size:14px">${title}</h3>` : '') + `
    <table><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rowsHtml}</tbody></table>`;
}

// отметки черновика хранятся в самом importDraft - переживают переключение вкладок и перерисовку
function impChecked(kind, cell, def) {
  const k = kind + ':' + cell;
  return importDraft._sel && k in importDraft._sel ? importDraft._sel[k] : def;
}
function impToggle(el) {
  importDraft._sel = importDraft._sel || {};
  importDraft._sel[el.dataset.kind + ':' + el.dataset.cell] = el.checked;
  updateImportTotals();
}
function impTile(n, label, color, hint) {
  return `<div style="flex:1;min-width:170px;padding:10px 14px;background:var(--surface2);border-radius:8px;border-left:4px solid ${color}">
    <div style="font-size:22px;font-weight:700;color:${color}">${n}</div>
    <div style="font-size:13px;font-weight:600">${label}</div>
    <div style="font-size:11px;color:var(--text2)">${hint}</div></div>`;
}

function renderImportDraft() {
  const d = importDraft;
  const wrap = document.getElementById('table-wrap');
  const ctrlOk = d.control.every(c => c.ok);
  const spread = d.spread || [];
  const byPer = (a, b) => (a.period + a.supplier).localeCompare(b.period + b.supplier, 'uk');
  const newRows = d.rows.filter(r => r.kind === 'new').sort(byPer);
  const confl = d.rows.filter(r => r.kind === 'conflict').sort(byPer);
  const opNew = d.openings.filter(o => o.state !== 'same');
  const badge = document.getElementById('count-badge');
  if (badge) badge.textContent = `нужно решить ${confl.length} · новых ${newRows.length} · разнесено вручную ${spread.length} · совпадает ${d.same}`;

  let h = `<div style="padding:10px 16px;background:var(--surface2);border-radius:8px;margin:12px 0;font-size:13px">
    <b>📄 ${escHtml(d.file)}</b>
    <span style="margin-left:12px">${ctrlOk ? '<span style="color:var(--green)">✓ итоги «Общая сумма» сходятся</span>'
      : d.control.filter(c => !c.ok).map(c => `<span style="color:var(--red)">✗ ${escHtml(c.label)} ${fmt(c.total)} ≠ ${fmt(c.rows)}</span>`).join(' ')}</span>
    ${d.repeat ? `<div style="color:var(--orange);margin-top:6px">⚠ Этот же файл уже загружали ${escHtml((d.repeat.applied_at || '').slice(0, 16).replace('T', ' '))} (${escHtml(d.repeat.applied_by || '')}).</div>` : ''}
    ${!ctrlOk ? `<div style="color:var(--red);margin-top:6px;font-weight:600">Суммы строк не сходятся с «Общая сумма» — запись запрещена. Проверьте файл.</div>` : ''}
    ${d.unmapped.length ? `<div style="color:var(--red);margin-top:6px">Не записываются — имени нет в маппинге: ${d.unmapped.map(escHtml).join(', ')}.</div>` : ''}
  </div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px">
    ${impTile(confl.length, 'Нужно решить', confl.length ? 'var(--red)' : 'var(--green)', 'Excel ≠ админка, итог за месяцы тоже не сходится')}
    ${impTile(newRows.length, 'Новые', '#60a5fa', 'в админке пусто — отмечены к записи')}
    ${impTile(spread.length, 'Разнесено вручную', '#94a3b8', 'по месяцам разное, итог сходится — ничего не делать')}
    ${impTile(d.same, 'Совпадает', 'var(--green)', 'уже есть в админке')}
  </div>`;

  if (!newRows.length && !confl.length && !opNew.length) {
    h += `<div class="loading" style="color:var(--green)">✓ Записывать нечего — всё из файла уже есть в админке.</div>`;
  }
  if (confl.length) {
    h += impTable(`<span style="color:var(--red)">Нужно решить (${confl.length})</span> — в админке другая сумма. ` +
      `<span style="font-weight:400;color:var(--text2)">Галочка = заменить суммой из Excel (прежняя сохранится). Без галочки = оставить админку.</span>`,
      ['Взять из Excel', 'Ячейка', 'Поставщик', 'Период', 'В админке', 'В Excel', 'Разница', 'Примечание в Excel'],
      confl.map(r => `<tr>
        <td style="text-align:center"><input type="checkbox" class="imp-chk" data-kind="conflict" data-cell="${escHtml(r.cell)}" ${impChecked('conflict', r.cell, false) ? 'checked' : ''} onchange="impToggle(this)"></td>
        <td>${escHtml(r.cell)}</td>
        <td>${escHtml(r.supplier)}</td>
        <td>${escHtml(r.period)}</td>
        <td style="text-align:right">${fmt(r.previous)}</td>
        <td style="text-align:right">${fmt(r.amount)}</td>
        <td style="text-align:right;color:${r.amount - r.previous < 0 ? 'var(--red)' : 'var(--green)'}">${(r.amount - r.previous > 0 ? '+' : '') + fmt(r.amount - r.previous)}</td>
        <td style="font-size:12px;color:var(--text2)">${escHtml(r.note || '')}</td>
      </tr>`).join(''));
  }
  if (newRows.length) {
    h += impTable(`Новые (${newRows.length}) — в админке пусто`,
      ['Записать', 'Ячейка', 'Строка Excel → поставщик', 'Период', 'Сумма', 'Дата оплаты', 'Замечания'],
      newRows.map(r => `<tr>
        <td style="text-align:center"><input type="checkbox" class="imp-chk" data-kind="new" data-cell="${escHtml(r.cell)}" ${impChecked('new', r.cell, r.default) ? 'checked' : ''} onchange="impToggle(this)"></td>
        <td>${escHtml(r.cell)}</td>
        <td>${escHtml(r.excel_name)} → <b>${escHtml(r.supplier)}</b></td>
        <td>${escHtml(r.period)}</td>
        <td style="text-align:right">${fmt(r.amount)}</td>
        <td>${escHtml(r.payment_date || '')}</td>
        <td style="color:var(--orange);font-size:12px">${escHtml([...(r.flags || []), ...(r.extra || []).map(x => 'в сумме не ретро: ' + x)].join('; '))}</td>
      </tr>`).join(''));
  }
  if (spread.length) {
    h += `<details style="margin-top:18px"><summary style="cursor:pointer;font-size:14px;font-weight:600;color:var(--text2)">
      Разнесено вручную (${spread.length}) — поставщик платил за несколько месяцев сразу, в админке разнесено по месяцам. Итог совпадает, делать ничего не нужно ▸</summary>` +
      impTable('', ['Поставщик', 'Месяцы', 'По месяцам: Excel / админка', 'Итог Excel', 'Итог админки', 'Примечание в Excel'],
        spread.map(b => `<tr>
          <td>${escHtml(b.supplier)}</td>
          <td>${escHtml(b.months[0])} … ${escHtml(b.months[b.months.length - 1])}</td>
          <td style="font-size:12px">${b.cells.map(c => `${escHtml(c.period.slice(5))}: ${c.excel == null ? '—' : fmt(c.excel)} / ${c.admin == null ? '—' : fmt(c.admin)}`).join('<br>')}</td>
          <td style="text-align:right">${fmt(b.excel_total)}</td>
          <td style="text-align:right;color:var(--green)">${fmt(b.admin_total)}</td>
          <td style="font-size:12px;color:var(--text2)">${escHtml((b.notes || []).join(' · '))}</td>
        </tr>`).join('')) + `</details>`;
  }
  if (d.openings.length) {
    const opChecked = d._openings === undefined ? opNew.length > 0 : d._openings;
    h += `<h3 style="margin:18px 0 8px;font-size:14px">Бонусы на открытие магазинов: ${d.openings.length}, новых/изменённых ${opNew.length}</h3>
      <label style="font-size:13px"><input type="checkbox" id="imp-openings" ${opChecked && opNew.length ? 'checked' : ''} ${opNew.length ? '' : 'disabled'}
        onchange="importDraft._openings = this.checked; updateImportTotals()">
      записать новые/изменённые (${opNew.map(o => escHtml(o.excel_name) + ' · ' + escHtml(o.store) + ' ' + fmt(o.amount)).join('; ') || '—'})</label>`;
  }
  if (d.manual.length || d.skipped.length) {
    h += `<div style="color:var(--text2);font-size:12px;margin-top:12px">` +
      (d.manual.length ? `Составные строки (месяцы сверяются группой): ${d.manual.map(escHtml).join(', ')}. ` : '') +
      (d.skipped.length ? `Не ретро по маппингу: ${d.skipped.length}.` : '') + `</div>`;
  }
  h += `<div style="position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:12px 0;margin-top:16px;display:flex;gap:12px;align-items:center">
      <span id="imp-total" style="font-size:13px"></span>
      <button class="btn btn-green" id="imp-apply" onclick="applyImportDraft()">Записать отмеченные</button>
      <button class="btn btn-ghost" onclick="cancelImportDraft()">Отменить черновик</button>
      <span id="imp-status" style="font-size:12px;color:var(--text2)"></span>
    </div>`;
  wrap.innerHTML = h;
  updateImportTotals();
}

function importSelection() {
  const pick = kind => [...document.querySelectorAll(`.imp-chk[data-kind="${kind}"]:checked`)].map(c => c.dataset.cell);
  const op = document.getElementById('imp-openings');
  const newCells = pick('new'), conflictCells = pick('conflict');
  const sum = importDraft.rows.filter(r => (r.kind === 'new' && newCells.includes(r.cell)) ||
                                            (r.kind === 'conflict' && conflictCells.includes(r.cell)))
                              .reduce((s, r) => s + r.amount, 0);
  const openings = !!(op && op.checked);
  return { newCells, conflictCells, sum, openings, openingsN: openings ? importDraft.openings.filter(o => o.state !== 'same').length : 0 };
}

function updateImportTotals() {
  if (!importDraft) return;
  const s = importSelection();
  const ctrlOk = importDraft.control.every(c => c.ok);
  const btn = document.getElementById('imp-apply');
  document.getElementById('imp-total').innerHTML =
    `К записи: <b>${s.newCells.length}</b> новых` + (s.conflictCells.length ? ` + <b style="color:var(--orange)">${s.conflictCells.length}</b> перезапись` : '') +
    ` на <b>${fmt(s.sum)} ₴</b>` + (s.openingsN ? ` · бонусов на открытие: ${s.openingsN}` : '');
  if (btn) btn.disabled = !ctrlOk || (!s.newCells.length && !s.conflictCells.length && !s.openingsN);
}

async function applyImportDraft() {
  const s = importSelection();
  const msg = `Записать в админку из «${importDraft.file}»:\n\n` +
    `• новых фактов: ${s.newCells.length}\n` +
    (s.conflictCells.length ? `• ПЕРЕЗАПИСАТЬ внесённые в админке: ${s.conflictCells.length} (прежние суммы сохранятся)\n` : '') +
    `• сумма: ${fmt(s.sum)} ₴\n` +
    (s.openingsN ? `• бонусов на открытие магазинов: ${s.openingsN}\n` : '') +
    `\nПосле записи запустится сверка и поиск причин расхождений.`;
  if (!confirm(msg)) return;
  const btn = document.getElementById('imp-apply');
  btn.disabled = true;
  try {
    const res = await apiFetch(`/api/imports/${importDraft.import_id}/apply`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ new_cells: s.newCells, conflict_cells: s.conflictCells, openings: s.openings }) });
    const a = res.applied;
    toast(`✅ Записано фактов: ${a.written.facts}, бонусов: ${a.written.openings}`);
    const dropped = a.dropped_changed_meanwhile.length ? ` Пропущено (изменились в админке, пока смотрели): ${a.dropped_changed_meanwhile.join(', ')}.` : '';
    document.getElementById('table-wrap').innerHTML = `<div style="padding:16px;font-size:13px">
      <div style="font-size:15px;font-weight:600;color:var(--green)">✅ Записано: фактов ${a.written.facts} на ${fmt(a.amount)} ₴, бонусов на открытие ${a.written.openings}.</div>
      <div style="color:var(--orange)">${escHtml(dropped)}</div>
      <div id="job-box" style="margin-top:12px"></div></div>`;
    importDraft = null;
    importJobId = res.job_id;
    pollJob(res.job_id);
  } catch (e) {
    btn.disabled = false;
    toast('Помилка: ' + e.message, true);
  }
}

async function cancelImportDraft() {
  if (!importDraft) return;
  try { await apiFetch(`/api/imports/${importDraft.import_id}/cancel`, { method: 'POST' }); } catch (e) { /* черновик можно бросить */ }
  importDraft = null;
  switchToImport();
}

async function runReconcileOnly() {
  if (!confirm('Пересверить факты с расчётом и заново найти причины расхождений? (2–4 минуты, в факты ничего не пишется)')) return;
  try {
    const res = await apiFetch('/api/reconcile', { method: 'POST' });
    if (!importDraft) {
      document.getElementById('table-wrap').innerHTML = '<div id="job-box" style="padding:16px"></div>';
      importJobId = res.job_id;
      pollJob(res.job_id);
    } else {
      toast('Сверка запущена (2–4 мин). Черновик на месте; итог — во вкладке «Факт оплат ретро».');
    }
  } catch (e) { toast('Помилка: ' + e.message, true); }
}

async function pollJob(jobId) {
  const box = document.getElementById('job-box');
  if (!box) return;
  try {
    const j = await apiFetch(`/api/jobs/${jobId}`);
    const tail = (j.log || []).filter(l => l.trim()).slice(-12).map(escHtml).join('\n');
    if (j.status === 'running') {
      box.innerHTML = `<div style="color:var(--text2)">⏳ Сверка и диагностика идут (BigQuery)…</div><pre style="font-size:11px;color:var(--text2);white-space:pre-wrap">${tail}</pre>`;
      setTimeout(() => pollJob(jobId), 3000);
    } else {
      box.innerHTML = `<div style="font-weight:600;color:${j.status === 'done' ? 'var(--green)' : 'var(--red)'}">${j.status === 'done' ? '✅ Сверка завершена' : '✗ Сверка завершилась с ошибкой'}</div>
        <pre style="font-size:11px;color:var(--text2);white-space:pre-wrap">${tail}</pre>
        <button class="btn btn-primary" onclick="openReconProblems()">Открыть «Факт оплат ретро» → проблемы</button>`;
    }
  } catch (e) {
    box.innerHTML = `<div style="color:var(--red)">${escHtml(e.message)}</div>`;
  }
}

function onSearch(val) {
  searchTerm = val.toLowerCase();

async function loadTable() {
  const wrap = document.getElementById('table-wrap');
  wrap.innerHTML = '<div class="loading">Завантаження...</div>';
  const cfg = TABLES[currentTable];
  const { data, error } = await sb.from(currentTable).select('*').order(cfg.order || 'created_at', { ascending: true });
  if (error) { wrap.innerHTML = `<div class="loading" style="color:var(--red)">Помилка: ${error.message}</div>`; return; }
  allData[currentTable] = data || [];
  renderTable();
}

function renderTable() {
  const cfg = TABLES[currentTable];
  const data = filterData(allData[currentTable] || []);
  document.getElementById('count-badge').textContent = `${data.length} записей`;

  if (sortCol) {
    data.sort((a, b) => {
      let va = getCellValue(a, sortCol, cfg), vb = getCellValue(b, sortCol, cfg);
      if (va == null) va = ''; if (vb == null) vb = '';
      let cmp = String(va).localeCompare(String(vb), 'uk', { numeric: true });
      return sortDir === 'desc' ? -cmp : cmp;
    });
  }

  const wrap = document.getElementById('table-wrap');
  let html = '<table><thead><tr>';
  if (cfg.showRowNum) html += '<th style="width:40px;text-align:center">№</th>';
  cfg.columns.forEach(col => {
    const arrow = sortCol === col.key ? (sortDir === 'asc' ? '▲' : '▼') : '';
    html += `<th style="${col.width ? 'min-width:'+col.width : ''}" onclick="toggleSort('${col.key}')">${col.label}<span class="sort-arrow">${arrow}</span></th>`;
  });
  html += '<th style="width:80px">Действия</th></tr></thead><tbody>';

  data.forEach((row, idx) => {
    html += '<tr>';
    if (cfg.showRowNum) html += `<td style="text-align:center;color:var(--text2)">${idx + 1}</td>`;
    cfg.columns.forEach(col => {
      const val = getCellValue(row, col.key, cfg);
      let display = formatCell(val, col);
      const cls = col.editable ? ' class="editable" ondblclick="openEditModal(\''+row.id+'\')"' : '';
      html += `<td${cls}>${display}</td>`;
    });
    html += `<td>
      <button class="btn btn-ghost" style="padding:3px 8px;font-size:12px" onclick="openEditModal('${row.id}')">✎</button>
      <button class="btn btn-ghost" style="padding:3px 8px;font-size:12px;color:var(--red)" onclick="deleteRow('${row.id}')">✕</button>
    </td>`;
    html += '</tr>';
  });

  html += '</tbody></table>';
  wrap.innerHTML = html;
}

function getCellValue(row, key, cfg) {
  if (key === '_supplier_name') {
    if (row.supplier_id) return lookups.suppliers[row.supplier_id] || '—';
    if (row.supplier_brand_id) {
      const sid = lookups.brand_supplier && lookups.brand_supplier[row.supplier_brand_id];
      return sid ? (lookups.suppliers[sid] || '—') : '—';
    }
    return '—';
  }
  if (key === '_brand_name') {
    if (row.supplier_brand_id) return lookups.supplier_brands[row.supplier_brand_id] || '—';
    return '—';
  }
  return row[key];
}

function formatCell(val, col) {
  if (val === null || val === undefined) return '<span style="color:var(--text2)">—</span>';
  if (col.type === 'bool') return val ? '<span class="tag tag-green">Да</span>' : '<span class="tag tag-red">Нет</span>';
  if (col.type === 'sku_count') {
    if (Array.isArray(val)) return `<span class="tag tag-blue">${val.length} шт</span>`;
    if (typeof val === 'string' && val.startsWith('[')) { try { return `<span class="tag tag-blue">${JSON.parse(val).length} шт</span>`; } catch(e) {} }
    return '—';
  }
  if (col.type === 'alias_type_tag') {
    if (val === 'branded')   return '<span class="tag tag-green">Branded</span>';
    if (val === 'remainder') return '<span class="tag tag-orange">Remainder</span>';
    if (val === 'excluded')  return '<span class="tag tag-red">Excluded</span>';
    return '<span class="tag tag-blue">' + (val || '—') + '</span>';
  }
  if (col.key === 'bonus_form') {
    if (val === 'marketing_service') return '<span class="tag tag-orange">Маркетинг (НДС)</span>';
    return '<span class="tag tag-blue">Ф2 (нал)</span>';
  }
  if (col.key === 'retro_base_type') {
    const m = { shipment_minus_return: 'Приход−возврат', payments: 'Оплаты', per_portion_sold: 'За порцію' };
    return m[val] || val;
  }
  if (col.key === 'status') {
    const colors = { draft: 'tag-blue', active: 'tag-green', archived: 'tag-red', in_progress: 'tag-orange', completed: 'tag-green', approved: 'tag-green', paid: 'tag-green', cancelled: 'tag-red' };
    return `<span class="tag ${colors[val] || ''}">${val}</span>`;
  }
  if (col.key === 'retro_min' || col.key === 'retro_max') return val + '%';
  return escHtml(String(val));
}

function escHtml(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function filterData(data) {
  if (!searchTerm) return [...data];
  return data.filter(row => {
    const cfg = TABLES[currentTable];
    return cfg.columns.some(col => {
      const v = getCellValue(row, col.key, cfg);
      return v != null && String(v).toLowerCase().includes(searchTerm);
    });
  });
}

function toggleSort(col) {
  if (sortCol === col) { sortDir = sortDir === 'asc' ? 'desc' : 'asc'; }
  else { sortCol = col; sortDir = 'asc'; }
  renderTable();
}

async function openEditModal(id) {
  await loadLookups();
  const cfg = TABLES[currentTable];
  const row = (allData[currentTable] || []).find(r => r.id === id);
  if (!row) return;
  renderModal('Редагування', cfg.editFields, row, async (vals) => {
    const clean = cleanVals(vals, cfg);
    const { error } = await sb.from(currentTable).update(clean).eq('id', id);
    if (error) { toast('Помилка: ' + error.message, true); return; }
    toast('Збережено');
    closeModal();
    if (currentTable === 'suppliers' || currentTable === 'supplier_brands') await loadLookups();
    await loadTable();
  });
}

async function openAddModal() {
  await loadLookups();
  const cfg = TABLES[currentTable];
  renderModal('Додати запис', cfg.editFields, {}, async (vals) => {
    const clean = cleanVals(vals, cfg);
    const { error } = await sb.from(currentTable).insert(clean);
    if (error) { toast('Помилка: ' + error.message, true); return; }
    toast('Додано');
    closeModal();
    if (currentTable === 'suppliers' || currentTable === 'supplier_brands') await loadLookups();
    await loadTable();
  });
}

      `<option value="${s}" ${val===s?'selected':''}>${s}</option>`
    ).join('')}
  </select>`;
    } else if (f === 'notes' || f === 'extra_conditions' || f === 'retro_description') {
      html += `<label>${label}</label><textarea id="f_${f}">${escHtml(String(val || ''))}</textarea>`;

    } else {
      html += `<label>${label}</label><input id="f_${f}" value="${escHtml(String(val || ''))}">`;
    }
  });
  html += `<div class="actions">
    <button class="btn btn-ghost" onclick="closeModal()">Отмена</button>
    <button class="btn btn-green" onclick="saveModal()">Сохранить</button>
  </div>`;

  document.getElementById('modal').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('show');

  window._modalSave = () => {
    const vals = {};
    fields.forEach(f => {
      const el = document.getElementById('f_' + f);
      if (el) vals[f] = el.value;
    });
    const required = {
  suppliers: ['name'],
  supplier_brands: ['supplier_id', 'name'],
  supplier_aliases: ['supplier_id', 'alias_name', 'alias_type'],
  retro_rules: ['supplier_brand_id', 'retro_min'],
  supplier_monthly_bonuses: ['supplier_id', 'amount', 'valid_from'],
};
const reqLabels = {
  name: 'Название', supplier_id: 'Поставщик', alias_name: 'Имя алиаса',
  supplier_brand_id: 'Бренд', retro_min: '% мин', alias_type: 'Тип алиаса',
  amount: 'Сумма', valid_from: 'Дата начала',
};
    const missing = (required[currentTable] || []).filter(f => !vals[f] || !String(vals[f]).trim());
    if (missing.length) {
      toast('Заполните: ' + missing.map(f => reqLabels[f] || f).join(', '), true);
      return;
    }
    if (currentTable === 'supplier_aliases') {
      if (vals.alias_type === 'branded' && !vals.supplier_brand_id) {
        toast('Для Branded-алиаса нужно выбрать бренд', true);
        return;
      }
      if (vals.alias_type !== 'branded') {
        vals.supplier_brand_id = '';
      }
    }
    onSave(vals);
  };
}

function filterBrandDropdown() {
  const suppSelect = document.getElementById('f_supplier_id');
  const brandSelect = document.getElementById('f_supplier_brand_id');
  if (!suppSelect || !brandSelect) return;
  const suppId = suppSelect.value;
  const options = brandSelect.querySelectorAll('option[data-supplier]');
  brandSelect.value = '';
  options.forEach(opt => {

      opt.disabled = false;

      opt.hidden = true;
      opt.disabled = true;
    }
  });
}

    }
if (k === 'retro_min' || k === 'retro_max' || k === 'min_purchase_threshold' || k === 'price_per_portion' || k === 'amount') {
  clean[k] = v ? parseFloat(v) : null;
  return;
}
    if (k === 'cups_per_kg') {

async function loadReconciliation() {
  const wrap = document.getElementById('table-wrap');
  wrap.innerHTML = '<div class="loading">Завантаження...</div>';

  await loadLookups();

  // Загружаем начисления
  const { data: calcs, error: e1 } = await sb.from('retro_calculations')
    .select('id, supplier_id, period_label, total_retro, status');

  // Загружаем base_type для каждого поставщика
  const { data: rules } = await sb.from('retro_rules')
    .select('supplier_brand_id, retro_base_type')
    .eq('status', 'active');
  const { data: rulebBrands } = await sb.from('supplier_brands')
    .select('id, supplier_id');
  const baseTypeBySupplier = {};
  const brandSupMap = {};
  (rulebBrands || []).forEach(b => brandSupMap[b.id] = b.supplier_id);
  (rules || []).forEach(r => {
    const sid = brandSupMap[r.supplier_brand_id];
    if (sid && r.retro_base_type) baseTypeBySupplier[sid] = r.retro_base_type;
  });
  if (e1) {
    wrap.innerHTML = `<div class="loading" style="color:var(--red)">Помилка: ${e1.message}</div>`;
    return;
  }

  // Загружаем факты оплат
  const { data: facts, error: e2 } = await sb.from('retro_payments_fact')
    .select('id, supplier_id, period_label, amount_paid, payment_date, doc_number, notes');
  if (e2) {
    wrap.innerHTML = `<div class="loading" style="color:var(--red)">Помилка: ${e2.message}</div>`;
    return;
  }

  // Собираем список месяцев (из начислений + фактов)
  const monthsSet = new Set();
  (calcs || []).forEach(c => monthsSet.add(c.period_label));
  (facts || []).forEach(f => monthsSet.add(f.period_label));
  const months = Array.from(monthsSet).sort();

  // Собираем список поставщиков (только тех, у кого есть начисления или факты)
  const supSet = new Set();
  (calcs || []).forEach(c => supSet.add(c.supplier_id));
  (facts || []).forEach(f => supSet.add(f.supplier_id));
  const suppliers = Array.from(supSet)
    .map(id => ({ id, name: lookups.suppliers[id] || '???' }))
    .sort((a, b) => a.name.localeCompare(b.name, 'uk'));

  // Результаты автосверки (core/reconcile_facts.py + диагностика) — только чтение
  const { data: recon, error: e3 } = await sb.from('retro_reconciliation')
    .select('supplier_id, period_label, status, diagnosis, delta, excel_amount, excel_cell, group_key, checked_at')
    .range(0, 4999);
  const reconMap = {};
  (recon || []).forEach(r => { reconMap[r.supplier_id + '|' + r.period_label] = r; });
  if (e3) console.warn('retro_reconciliation:', e3.message);

  // Доплаты «не ретро» (оба режима) — для ячеек и окна факта
  const { data: adjRows, error: e4 } = await sb.from('retro_adjustments').select('*');
  const adjMap = {};
  (adjRows || []).forEach(a => { const k = a.supplier_id + '|' + a.period_label; (adjMap[k] = adjMap[k] || []).push(a); });
  if (e4) console.warn('retro_adjustments:', e4.message);

  reconData = { calcs: calcs || [], facts: facts || [], months, suppliers, baseTypeBySupplier, reconMap, adjs: adjMap };
  renderReconciliation();
}

// Статусы автосверки: quiet = не шумим бейджем, только подсказка

  MINOR:          { icon: '✓',  label: 'до 2%',               color: 'var(--green)',  quiet: true },
  ZERO_OK:        { icon: '✓',  label: '0 = 0',               color: 'var(--text2)',  quiet: true },
  REDISTRIBUTION: { icon: '↔',  label: 'разнесено по месяцам', color: 'var(--text2)' },
  MISMATCH:       { icon: '❗', label: 'расхождение',          color: 'var(--red)' },
  MANUAL:         { icon: '✋', label: 'ручной разбор',        color: 'var(--orange)' },
  STALE_CALC:     { icon: '⟳',  label: 'пересчитать',          color: 'var(--orange)' },
  PENDING:        { icon: '⏳', label: 'ждём оплату',          color: 'var(--text2)',  quiet: true },
  NOT_PAID:       { icon: '🔴', label: 'не оплачено',          color: 'var(--red)' },
  NOT_EXPECTED:   { icon: '🏦', label: 'безнал',               color: 'var(--text2)',  quiet: true },
  EXCEL_ONLY:     { icon: '📄', label: 'внести из Excel',      color: 'var(--orange)' },
  ZERO_BUT_CALC:  { icon: '⚠',  label: '0 при начислении',     color: 'var(--red)' },
  FACT_NO_CALC:   { icon: '🟣', label: 'нет расчёта',          color: '#a78bfa' },
  EXCLUDED_OWNER: { icon: '🔒', label: 'не сверяется',         color: 'var(--text2)',  quiet: true },
};
const RECON_PROBLEMS = new Set(['MISMATCH', 'MANUAL', 'STALE_CALC', 'NOT_PAID', 'EXCEL_ONLY', 'ZERO_BUT_CALC', 'FACT_NO_CALC']);

function baseTypeIcon(baseType) {
  if (baseType === 'payments') return '<span title="Ретро від оплат" style="cursor:help">💳</span>';
  if (baseType === 'per_portion_sold') return '<span title="Ретро за порцію" style="cursor:help">☕</span>';
  return '<span title="Ретро від приходів" style="cursor:help">🧾</span>';
}


function renderReconciliation() {
  const wrap = document.getElementById('table-wrap');
  const { calcs, facts, months, suppliers } = reconData;

  if (!months.length || !suppliers.length) {
    wrap.innerHTML = '<div class="loading">Нет данных. Сначала запустите расчёт ретро (calculate_retro.py).</div>';
    return;
  }

  // Индексируем по (supplier_id + period_label)
  const calcMap = {}; // key → total_retro
  const factMap = {}; // key → {amount_paid, id, payment_date, doc_number, notes}
  calcs.forEach(c => { calcMap[c.supplier_id + '|' + c.period_label] = { total: parseFloat(c.total_retro) || 0, id: c.id, status: c.status }; });
  facts.forEach(f => {
    factMap[f.supplier_id + '|' + f.period_label] = {
      id: f.id,
      amount: parseFloat(f.amount_paid) || 0,
      date: f.payment_date,
      doc: f.doc_number,
      notes: f.notes
    };
  });

  // Фильтрация поставщиков
  let filtered = suppliers.filter(s => {
    if (searchTerm && !s.name.toLowerCase().includes(searchTerm)) return false;

    if (reconFilter === 'all') return true;
    if (reconFilter === 'recon_problems') {
      return months.some(m => RECON_PROBLEMS.has(((reconData.reconMap || {})[s.id + '|' + m] || {}).status));
    }

    // Считаем суммы по поставщику за все месяцы
    let totalCharged = 0, totalPaid = 0;
    months.forEach(m => {
      totalCharged += (calcMap[s.id + '|' + m] || {}).total || 0;
      totalPaid += (factMap[s.id + '|' + m] || {}).amount || 0;
    });

    if (reconFilter === 'unpaid') return totalCharged > 0 && totalPaid === 0;
    if (reconFilter === 'with_diff') {
      if (totalCharged === 0) return false;
      const diffPct = Math.abs(totalPaid - totalCharged) / totalCharged * 100;
      return diffPct > 2;
    }
    if (reconFilter === 'zero_charged') return totalCharged === 0;
    return true;
  });

  document.getElementById('count-badge').textContent = `${filtered.length} поставщиков, ${months.length} месяцев`;

  // Рендер таблицы
  let html = '<table><thead><tr>';
  html += '<th style="width:40px;text-align:center">№</th>';
  html += '<th style="min-width:220px;position:sticky;left:0;background:var(--surface2);z-index:11">Поставщик</th>';
  months.forEach(m => {
    html += `<th style="min-width:180px;text-align:center" colspan="1">${m}</th>`;
  });
  html += '<th style="min-width:160px;text-align:center;background:var(--surface2)">ИТОГО</th>';
  html += '</tr></thead><tbody>';

  // Итоги по столбцам
  const colTotals = {};
  months.forEach(m => colTotals[m] = { charged: 0, paid: 0 });
  let grandCharged = 0, grandPaid = 0;

  filtered.forEach((s, idx) => {
    let rowCharged = 0, rowPaid = 0;
    let cellsHtml = '';
    months.forEach(m => {
      const calcEntry = calcMap[s.id + '|' + m] || {};
      const charged = calcEntry.total || 0;
      const factRow = factMap[s.id + '|' + m];
      const paid = factRow ? factRow.amount : 0;
      rowCharged += charged;
      rowPaid += paid;
      colTotals[m].charged += charged;
      colTotals[m].paid += paid;
      cellsHtml += renderReconCell(s.id, m, charged, factRow, calcEntry);
    });
    grandCharged += rowCharged;
    grandPaid += rowPaid;

    const rowStatus = getReconStatus(rowCharged, rowPaid);
    html += `<tr>
      <td style="text-align:center;color:var(--text2)">${idx + 1}</td>
      <td style="position:sticky;left:0;background:var(--surface);font-weight:500">
        ${baseTypeIcon(reconData.baseTypeBySupplier[s.id])} ${escHtml(s.name)}
      </td>
      ${cellsHtml}
      <td style="text-align:right;background:var(--surface2);font-weight:600">
        <div style="color:${rowStatus.color}">${fmt(rowPaid)} / ${fmt(rowCharged)}</div>
        <div style="font-size:11px;color:var(--text2)">${rowStatus.label}</div>
      </td>
    </tr>`;
  });

  // Строка итогов
  html += `<tr style="background:var(--surface2);font-weight:600;border-top:2px solid var(--accent)">
    <td></td>
    <td style="position:sticky;left:0;background:var(--surface2)">ИТОГО</td>`;
  months.forEach(m => {
    const t = colTotals[m];
    const st = getReconStatus(t.charged, t.paid);
    html += `<td style="text-align:right;padding:8px 10px">
      <div style="color:${st.color}">${fmt(t.paid)}</div>
      <div style="font-size:11px;color:var(--text2)">из ${fmt(t.charged)}</div>
    </td>`;
  });
  const totalStatus = getReconStatus(grandCharged, grandPaid);
  html += `<td style="text-align:right;padding:8px 10px;background:var(--surface)">
    <div style="color:${totalStatus.color};font-size:14px">${fmt(grandPaid)}</div>
    <div style="font-size:11px;color:var(--text2)">из ${fmt(grandCharged)}</div>
  </td>`;
  html += '</tr>';

  html += '</tbody></table>';
  wrap.innerHTML = html;
}

function renderReconCell(supId, period, charged, factRow, calcEntry) {
  const paid = factRow ? factRow.amount : 0;
  const status = getReconStatus(charged, paid);
  const isApproved = calcEntry && calcEntry.status === 'approved';
  const isPaid = calcEntry && calcEntry.status === 'paid';
  const isLocked = isApproved || isPaid;
  const calcId = calcEntry && calcEntry.id;

  const tooltip = factRow ?
    `Оплачено ${fmt(paid)}\nДата: ${factRow.date || '—'}\nДокумент: ${factRow.doc || '—'}\nЗаметки: ${factRow.notes || '—'}` :
    (charged > 0 ? `Не оплачено\nНачислено: ${fmt(charged)}` : 'Нет начислений');

  const rc = (reconData.reconMap || {})[supId + '|' + period];
  const rcInfo = rc ? (RECON_LABELS[rc.status] || { icon: '?', label: rc.status, color: 'var(--text2)' }) : null;
  const fullTooltip = rc
    ? `${tooltip}\n\nАвтосверка: ${rcInfo.label}${rc.group_key ? ' (группа: ' + rc.group_key + ')' : ''}` +
      `${rc.diagnosis ? '\n' + rc.diagnosis : ''}\nпроверено ${(rc.checked_at || '').slice(0, 16).replace('T', ' ')}`
    : tooltip;
  const reconBadge = rc && !rcInfo.quiet
    ? `<div style="font-size:10px;margin-top:2px;color:${rcInfo.color}">${rcInfo.icon} ${rcInfo.label}</div>`
    : '';

  const lockBadge = isLocked
    ? `<div style="font-size:10px;color:${isPaid ? 'var(--green)' : '#a78bfa'};margin-top:2px">${isPaid ? '💚 оплачено' : '🔒 затверджено'}</div>`
    : '';

  const approveBtn = calcId && !isLocked && charged > 0
    ? `<button onclick="event.stopPropagation();approveCalc('${calcId}','${supId}','${period}')"
         title="Затвердити — захистить від перезапису"
         style="margin-top:4px;font-size:10px;padding:2px 6px;border:1px solid #a78bfa;background:transparent;color:#a78bfa;border-radius:4px;cursor:pointer">🔒 lock</button>`
    : '';

  const unlockBtn = isApproved && calcId
    ? `<button onclick="event.stopPropagation();unlockCalc('${calcId}','${supId}','${period}')"
         title="Зняти захист"
         style="margin-top:4px;font-size:10px;padding:2px 6px;border:1px solid var(--text2);background:transparent;color:var(--text2);border-radius:4px;cursor:pointer">🔓</button>`
    : '';

  const sepSum = ((reconData.adjs || {})[supId + '|' + period] || []).filter(a => adjMode(a) === 'separate')
    .reduce((acc, a) => acc + (parseFloat(a.amount) || 0), 0);
  const sepLine = sepSum ? `<div style="font-size:10px;color:#94a3b8" title="Заплачено отдельно, в «Оплачено» не входит">+${fmt(sepSum)} отдельно</div>` : '';

  return `<td class="${isLocked ? '' : 'editable'}"
            style="text-align:right;padding:6px 10px;background:${isLocked ? 'rgba(167,139,250,0.05)' : status.bg}"
            ondblclick="${isLocked ? '' : `openReconCellModal('${supId}','${period}')`}"
            title="${escHtml(fullTooltip)}">
    <div style="color:${status.color};font-weight:500">${fmt(paid)}</div>
    <div style="font-size:11px;color:var(--text2)">з ${fmt(charged)} ${status.icon}</div>
    ${sepLine}
    ${reconBadge}
    ${lockBadge}
    ${approveBtn}
    ${unlockBtn}
  </td>`;
}

function getReconStatus(charged, paid) {
  if (charged === 0 && paid === 0) {
    return { color: 'var(--text2)', bg: 'transparent', icon: '⬜', label: '—' };
  }
  if (charged === 0 && paid > 0) {
    return { color: '#a78bfa', bg: 'rgba(167,139,250,0.08)', icon: '🟣', label: 'Без начисления' };
  }
  const pct = paid / charged * 100;
  if (paid === 0) return { color: 'var(--red)', bg: 'rgba(248,113,113,0.08)', icon: '🔴', label: 'Не оплачено' };
  if (pct < 50) return { color: 'var(--red)', bg: 'rgba(248,113,113,0.08)', icon: '🔴', label: `${pct.toFixed(0)}%` };
  if (pct < 98) return { color: 'var(--orange)', bg: 'rgba(251,191,36,0.08)', icon: '🟡', label: `${pct.toFixed(0)}%` };
  if (pct <= 102) return { color: 'var(--green)', bg: 'rgba(52,211,153,0.08)', icon: '🟢', label: 'OK' };
  return { color: '#a78bfa', bg: 'rgba(167,139,250,0.08)', icon: '🟣', label: `+${(pct-100).toFixed(0)}%` };
}

async function approveCalc(calcId, supId, period) {
  const sup = reconData.suppliers.find(s => s.id === supId);
  const supName = sup ? sup.name : supId;
  if (!confirm(`Затвердити розрахунок:\n${supName} — ${period}?\n\nПісля затвердження автоматичний перерахунок НЕ буде перезаписувати цей місяць.`)) return;
  const { error } = await sb.from('retro_calculations').update({ status: 'approved' }).eq('id', calcId);
  if (error) { toast(`Помилка: ${error.message}`, true); return; }
  toast(`🔒 ${supName} ${period} — затверджено`);
  await loadReconciliation();
}

async function unlockCalc(calcId, supId, period) {
  const sup = reconData.suppliers.find(s => s.id === supId);
  const supName = sup ? sup.name : supId;
  if (!confirm(`Зняти захист:\n${supName} — ${period}?\n\nПісля зняття автоматичний перерахунок зможе перезаписати цей місяць.`)) return;
  const { error } = await sb.from('retro_calculations').update({ status: 'completed' }).eq('id', calcId);
  if (error) { toast(`Помилка: ${error.message}`, true); return; }
  toast(`🔓 ${supName} ${period} — захист знято`);
  await loadReconciliation();
}

function fmt(n) {
  if (!n) return '0';
  return n.toLocaleString('uk-UA', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

async function openReconCellModal(supId, period) {
  const calcMap = {};
  reconData.calcs.forEach(c => { calcMap[c.supplier_id + '|' + c.period_label] = { total: parseFloat(c.total_retro) || 0, id: c.id, status: c.status }; });
  const calcEntry = calcMap[supId + '|' + period] || {};
  const charged = calcEntry.total || 0;
  const calcId = calcEntry.id || null;

  const factRow = reconData.facts.find(f => f.supplier_id === supId && f.period_label === period);
  const sup = reconData.suppliers.find(s => s.id === supId);
  const supName = sup ? sup.name : '???';

  const adjs = (reconData.adjs || {})[supId + '|' + period] || [];
  const inPay = adjs.filter(a => adjMode(a) === 'in_payment');
  const separate = adjs.filter(a => adjMode(a) === 'separate');
  const sumOf = list => list.reduce((s, a) => s + (parseFloat(a.amount) || 0), 0);
  let extrasHtml = '';
  adjs.forEach(a => {
    const sep = adjMode(a) === 'separate';
    const amt = parseFloat(a.amount) || 0;
    extrasHtml += `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;
      padding:4px 8px;background:${sep ? 'rgba(148,163,184,0.10)' : 'rgba(52,211,153,0.08)'};border-radius:4px;margin-bottom:3px;font-size:12px">
      <span style="color:var(--text2)">${escHtml(a.notes || '—')}
        <span style="font-size:10px;padding:1px 6px;border-radius:8px;margin-left:6px;border:1px solid ${sep ? '#94a3b8' : 'var(--green)'};color:${sep ? '#94a3b8' : 'var(--green)'}">
          ${sep ? 'отдельно, не в «Оплачено»' : 'в «Оплачено», + к начислению'}</span></span>
      <div style="display:flex;align-items:center;gap:8px">
        <span style="color:${amt < 0 ? 'var(--red)' : (sep ? 'var(--text2)' : 'var(--green)')};font-weight:600">${amt > 0 ? '+' : ''}${fmt(amt)} ₴</span>
        <button onclick="deleteExtraPayment('${a.id}', '${supId}', '${period}')"
          style="background:none;border:none;color:var(--red);cursor:pointer;font-size:14px;padding:0 2px;line-height:1"
          title="Видалити">✕</button>
      </div>
    </div>`;
  });
  const chargedNote = [
    inPay.length ? `в т.ч. доплаты ${fmt(sumOf(inPay))} ₴` : '',
    separate.length ? `отдельно (не в «Оплачено»): ${fmt(sumOf(separate))} ₴` : ''].filter(Boolean).join(' · ');

  const html = `
    <h2>💰 Факт оплаты ретро</h2>
    <div style="padding:12px;background:var(--surface2);border-radius:6px;margin-bottom:16px">
      <div style="font-size:14px;font-weight:600;margin-bottom:6px">${escHtml(supName)}</div>
      <div style="color:var(--text2);font-size:13px">Период: <b style="color:var(--text)">${period}</b></div>
      <div style="color:var(--text2);font-size:13px">Начислено: <b style="color:var(--accent)">${fmt(charged)} ₴</b></div>
      ${chargedNote ? `<div style="color:var(--text2);font-size:12px">${chargedNote}</div>` : ''}
    </div>
    ${(() => {
      const rc = (reconData.reconMap || {})[supId + '|' + period];
      if (!rc) return '';
      const info = RECON_LABELS[rc.status] || { icon: '?', label: rc.status, color: 'var(--text2)' };
      return `<div style="padding:10px 12px;border-left:3px solid ${info.color};background:var(--surface2);border-radius:6px;margin-bottom:16px;font-size:12px">
        <div style="font-weight:600;color:${info.color};margin-bottom:4px">${info.icon} Автосверка: ${escHtml(info.label)}${rc.group_key ? ' · группа ' + escHtml(rc.group_key) : ''}</div>
        ${rc.diagnosis ? `<div style="color:var(--text);white-space:pre-wrap">${escHtml(rc.diagnosis).replace(/; /g, '\n')}</div>` : ''}
        <div style="color:var(--text2);margin-top:4px">проверено ${escHtml((rc.checked_at || '').slice(0, 16).replace('T', ' '))}</div>
      </div>`;
    })()}

    <label>Оплачено, грн *</label>
    <input id="f_amount_paid" type="number" step="0.01" value="${factRow ? factRow.amount_paid : ''}" placeholder="0.00">

    <label>Дата оплаты</label>
    <input id="f_payment_date" type="date" value="${factRow && factRow.payment_date ? factRow.payment_date : ''}">

    <label>№ документа</label>
    <input id="f_doc_number" value="${escHtml(factRow && factRow.doc_number || '')}" placeholder="напр. Акт №123 от 15.02.2026">

    <label>Заметки</label>
    <textarea id="f_notes">${escHtml(factRow && factRow.notes || '')}</textarea>

    <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border)">
      <div style="font-size:13px;font-weight:600;margin-bottom:4px;color:var(--text)">➕ Не ретро: ДМП, кубы, компенсации акций</div>
      ${extrasHtml}
      <div style="display:flex;gap:8px;margin-top:6px">
        <input id="f_extra_amount" type="number" step="0.01" placeholder="Сума, грн" style="width:140px">
        <input id="f_extra_notes" placeholder="Примітка (напр. ДМП, куби)" style="flex:1">
      </div>
      <div style="display:flex;flex-direction:column;gap:4px;margin:8px 0;font-size:12px">
        <label style="display:flex;gap:6px;align-items:flex-start;cursor:pointer;margin:0">
          <input type="radio" name="f_extra_mode" value="in_payment" checked style="width:auto;margin-top:2px">
          <span><b>Входит в «Оплачено»</b> — деньги пришли одной суммой с ретро (кубы, компенсация акций). Прибавится к «Начислено».</span></label>
        <label style="display:flex;gap:6px;align-items:flex-start;cursor:pointer;margin:0">
          <input type="radio" name="f_extra_mode" value="separate" style="width:auto;margin-top:2px">
          <span><b>Заплачено отдельно</b> — в «Оплачено» не вносили (ДМП). Только отметка: «Начислено» и сверка не меняются.</span></label>
      </div>
      <button class="btn btn-ghost" onclick="addExtraPayment('${supId}', '${period}', ${calcId ? "'" + calcId + "'" : 'null'})"
        style="white-space:nowrap;border-color:var(--green);color:var(--green)">+ Додати</button>
    </div>


    <div class="actions">
      ${factRow ? `<button class="btn btn-red" onclick="deleteReconFact('${factRow.id}')">Удалить</button>` : ''}
      <button class="btn btn-ghost" onclick="closeModal()">Отмена</button>
      <button class="btn btn-green" onclick="saveReconFact('${supId}','${period}',${factRow ? "'"+factRow.id+"'" : 'null'})">Сохранить</button>
    </div>
  `;

  document.getElementById('modal').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('show');
  setTimeout(() => document.getElementById('f_amount_paid').focus(), 100);
}

// ── Доплаты «не ретро» (retro_adjustments.payment_mode) ──
//   in_payment - деньги в «Оплачено» (кубы, компенсации акций) или договорённость: + к «Начислено» (строка расчёта)
//   separate   - заплачено отдельно (ДМП Славутич): только запись, «Начислено» и сверка не меняются
function adjMode(a) { return a.payment_mode || 'in_payment'; }

async function addExtraPayment(supId, period, calcId) {
  const amount = parseFloat(document.getElementById('f_extra_amount').value);
  const notes = (document.getElementById('f_extra_notes').value || '').trim();
  const modeEl = document.querySelector('input[name="f_extra_mode"]:checked');
  const mode = modeEl ? modeEl.value : 'in_payment';
  if (isNaN(amount) || amount === 0) { toast('Введіть суму (мінус = вирахування)', true); return; }
  if (!notes) { toast('Введіть примітку', true); return; }
  const what = mode === 'separate'
    ? `Записать ОТДЕЛЬНУЮ выплату ${fmt(amount)} ₴ за ${period} «${notes}»?\n\n«Начислено» и «Оплачено» не меняются — это только отметка, что деньги пришли вне ретро.`
    : `Добавить ${amount > 0 ? 'доплату' : 'вычет'} ${fmt(amount)} ₴ за ${period} «${notes}»?\n\nОна входит в «Оплачено», поэтому прибавится к «Начислено».`;
  if (!confirm(what)) return;

  let brandId = null;
  if (calcId) {
    const { data: existingDetail } = await sb.from('retro_calculation_details')
      .select('supplier_brand_id').eq('calculation_id', calcId).limit(1);
    brandId = existingDetail && existingDetail.length ? existingDetail[0].supplier_brand_id : null;
  }
  const { data: { user } } = await sb.auth.getUser();
  const row = { supplier_id: supId, supplier_brand_id: brandId, period_label: period, amount: amount,
                bonus_form: 'price_correction', notes: notes, source: 'admin', created_by: user ? user.email : null };
  if (mode === 'separate') row.payment_mode = 'separate';   // in_payment = значение по умолчанию в БД
  const { data: adj, error: e0 } = await sb.from('retro_adjustments').insert(row).select('id').single();
  if (e0) {
    toast('Помилка: ' + e0.message + (mode === 'separate' ? ' (выполнен ли sql/2026-09-11_adjustments_payment_mode.sql?)' : ''), true);
    return;
  }

  if (mode === 'in_payment' && calcId) {
    const { error: e1 } = await sb.from('retro_calculation_details').insert({
      adjustment_id: adj.id, calculation_id: calcId, supplier_brand_id: brandId, applied_percent: 0,
      amount_purchased: 0, amount_returned: 0, amount_net: 0, retro_amount: amount, retro_amount_vat: amount,
      bonus_form: 'price_correction', notes: notes });
    if (e1) {
      await sb.from('retro_adjustments').delete().eq('id', adj.id);   // откат
      toast('Помилка: ' + e1.message, true);
      return;
    }
    const { data: calc } = await sb.from('retro_calculations').select('total_retro').eq('id', calcId).single();
    const newTotal = Math.round(((parseFloat(calc.total_retro) || 0) + amount) * 100) / 100;
    await sb.from('retro_calculations').update({ total_retro: newTotal }).eq('id', calcId);
  }
  toast(mode === 'separate' ? '✅ Записано как отдельная выплата' : '✅ Доплату додано');
  await loadReconciliation();
  openReconCellModal(supId, period);
}

async function deleteExtraPayment(adjId, supId, period) {
  const { data: adj, error: e0 } = await sb.from('retro_adjustments').select('*').eq('id', adjId).single();
  if (e0 || !adj) { toast('Помилка: ' + (e0 ? e0.message : 'не найдено'), true); return; }
  if (!confirm(`Удалить «${adj.notes}» ${fmt(parseFloat(adj.amount))} ₴?` +
               (adjMode(adj) === 'in_payment' ? '\n«Начислено» уменьшится на эту сумму.' : ''))) return;
  if (adjMode(adj) === 'in_payment') {
    const { data: dets } = await sb.from('retro_calculation_details')
      .select('id, calculation_id, retro_amount').eq('adjustment_id', adjId);
    for (const d of (dets || [])) {
      await sb.from('retro_calculation_details').delete().eq('id', d.id);
      const { data: calc } = await sb.from('retro_calculations').select('total_retro').eq('id', d.calculation_id).single();
      const newTotal = (parseFloat(calc.total_retro) || 0) - (parseFloat(d.retro_amount) || 0);
      await sb.from('retro_calculations').update({ total_retro: Math.round(newTotal * 100) / 100 }).eq('id', d.calculation_id);
    }
  }
  const { error } = await sb.from('retro_adjustments').delete().eq('id', adjId);
  if (error) { toast('Помилка: ' + error.message, true); return; }
  toast('✅ Видалено');
  await loadReconciliation();
  openReconCellModal(supId, period);
}

async function saveReconFact(supId, period, factId) {
  const amount = parseFloat(document.getElementById('f_amount_paid').value);
  if (isNaN(amount) || amount < 0) {
    toast('Введите корректную сумму', true);
    return;
  }
  const payload = {
    supplier_id: supId,
    period_label: period,
    amount_paid: amount,
    payment_date: document.getElementById('f_payment_date').value || null,
    doc_number: document.getElementById('f_doc_number').value || null,
    notes: document.getElementById('f_notes').value || null,
    updated_at: new Date().toISOString(),
  };
  // Изменение уже внесённой суммы — только с подтверждением, прежнее значение сохраняем
  const prevFact = (factId && factId !== 'null') ? reconData.facts.find(f => f.id === factId) : null;
  if (prevFact && Math.abs((parseFloat(prevFact.amount_paid) || 0) - amount) >= 0.005) {
    if (!confirm(`Змінити факт оплати за ${period}:\n${fmt(prevFact.amount_paid)} → ${fmt(amount)} ₴?`)) return;
    payload.amount_previous = parseFloat(prevFact.amount_paid);
  }

  let result;
  if (factId && factId !== 'null') {
    result = await sb.from('retro_payments_fact').update(payload).eq('id', factId);
  } else {
    result = await sb.from('retro_payments_fact').upsert(payload, { onConflict: 'supplier_id,period_label' });
  }
  if (result.error) {
    toast('Помилка: ' + result.error.message, true);
    return;
  }
  toast('Збережено');
  closeModal();
  await loadReconciliation();
}

async function deleteReconFact(factId) {
  if (!confirm('Удалить запись об оплате?')) return;
  const { error } = await sb.from('retro_payments_fact').delete().eq('id', factId);
  if (error) {
    toast('Помилка: ' + error.message, true);
    return;
  }
  toast('Видалено');
  closeModal();
  await loadReconciliation();
}

async function requireLogin() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) { init(); return; }
  document.getElementById('nav').innerHTML = '';
  document.getElementById('toolbar').innerHTML = '';
  document.getElementById('info-box').innerHTML = '';
  document.getElementById('table-wrap').innerHTML = `
    <div style="max-width:340px;margin:80px auto;padding:24px;background:var(--surface);
                border:1px solid var(--border);border-radius:12px">
      <h2 style="font-size:16px;margin-bottom:16px">Вход в панель</h2>
      <label style="display:block;font-size:12px;color:var(--text2);margin-bottom:4px">Email</label>
      <input id="login_email" style="width:100%;padding:8px 10px;border:1px solid var(--border);
             background:var(--surface2);color:var(--text);border-radius:6px;margin-bottom:10px">
      <label style="display:block;font-size:12px;color:var(--text2);margin-bottom:4px">Пароль</label>
      <input id="login_pass" type="password" onkeydown="if(event.key==='Enter')doLogin()"
             style="width:100%;padding:8px 10px;border:1px solid var(--border);
             background:var(--surface2);color:var(--text);border-radius:6px;margin-bottom:16px">
      <button class="btn btn-primary" style="width:100%" onclick="doLogin()">Войти</button>
    </div>`;
}

async function doLogin() {
  const email = document.getElementById('login_email').value.trim();
  const password = document.getElementById('login_pass').value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { toast('Ошибка входа: ' + error.message, true); return; }
  location.reload();
}

requireLogin();
</script>
